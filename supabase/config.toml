project_id = "planb"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = false
# seed.sql requires two explicit existing Auth user UUIDs; see docs/backend.md.

[auth]
enabled = true
site_url = "http://localhost:8081"
additional_redirect_urls = ["http://localhost:8081", "planb://"]
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true
